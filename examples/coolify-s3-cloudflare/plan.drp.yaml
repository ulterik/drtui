# Planned recovery contract, not executable yet. Provider digests are placeholders.
# GitHub is the source of Compose definitions; R2 stores Coolify and database backups.
apiVersion: drtui.io/v1alpha1
kind: DisasterRecoveryPlan

metadata:
  id: coolify-s3-cloudflare
  name: Compose recovery from R2 with Cloudflare Tunnel
  version: 1.1.0
  description: Rebuild a Coolify host, restore Compose workloads, and replace a tunnel.
  labels:
    environment: production
    owner: platform

inputs:
  target_region:
    type: string
    description: Region offered by your selected Linux/VPS provider; prefer one near your users and backup storage.
    required: true
  target_size:
    type: string
    description: Provider size ID with enough memory for all Compose services and at least 200 GiB recovery disk.
    required: true
  target_image:
    type: string
    description: Exact immutable Ubuntu image ID supported by the selected hosting provider; do not select latest.
    required: true
  r2_endpoint:
    type: string
    description: Account-specific HTTPS S3 endpoint, https://<ACCOUNT_ID>.r2.cloudflarestorage.com.
    required: true
    pattern: '^https://[a-fA-F0-9]{32}\.r2\.cloudflarestorage\.com/?$'
  coolify_state_uri:
    type: string
    description: Exact immutable Coolify state backup object in R2; never select latest.
    required: true
    pattern: '^s3://[^/\s]+/[^\s]+$'
  coolify_state_sha256:
    type: string
    description: Expected SHA-256 from the trusted backup inventory.
    required: true
    pattern: '^[a-fA-F0-9]{64}$'
  recovery_manifest_uri:
    type: string
    description: Exact R2 object matching schemas/recovery-manifest.schema.json; declares GitHub revisions and database backup formats.
    required: true
    pattern: '^s3://[^/\s]+/[^\s]+$'
  recovery_manifest_sha256:
    type: string
    description: Expected SHA-256 of the recovery manifest from the trusted backup inventory.
    required: true
    pattern: '^[a-fA-F0-9]{64}$'
  cloudflare_account_id:
    type: string
    description: Account owning the replacement tunnel.
    required: true
    pattern: '^[a-fA-F0-9]{32}$'
  cloudflare_zone_id:
    type: string
    description: Exact zone ID containing the hostname routes to snapshot and replace.
    required: true
    pattern: '^[a-fA-F0-9]{32}$'

# requiredClis describes local prerequisites, not remote binaries or auto-install commands.
# Cloudflare owns the recovery secrets and R2 backups; S3 is an API, not an AWS dependency.
providers:
  recovery_secrets:
    kind: keyvault
    source: oci://ghcr.io/drtui/cloudflare-secrets-provider
    version: 0.1.0
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    requiredClis: [cf]
    config:
      accountId: ""
  s3:
    kind: storage
    source: oci://ghcr.io/drtui/s3-provider
    version: 1.3.1
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    requiredClis: [cf]
    config:
      endpoint: "${{ inputs.r2_endpoint }}"
      region: auto
      accessKeyId: "${{ steps.fetch_secrets.outputs.r2_access_key_id }}"
      secretAccessKey: "${{ steps.fetch_secrets.outputs.r2_secret_access_key }}"
      checksumMode: required
      tlsRequired: true
  hosting:
    kind: infrastructure
    source: oci://ghcr.io/drtui/hosting-provider
    version: 0.1.0
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
    requiredClis: []
    config:
      provisioning: native-cli
      provider: ""
      clientPath: ""
  coolify:
    kind: application
    source: oci://ghcr.io/drtui/coolify-provider
    version: 2.0.0
    digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
    requiredClis: [coolify]
    config:
      releaseChannel: stable
  github:
    kind: storage
    source: oci://ghcr.io/drtui/github-provider
    version: 0.1.0
    digest: sha256:8888888888888888888888888888888888888888888888888888888888888888
    requiredClis: [gh]
  compose:
    kind: application
    source: oci://ghcr.io/drtui/compose-provider
    version: 0.1.0
    digest: sha256:9999999999999999999999999999999999999999999999999999999999999999
    requiredClis: []
  cloudflare:
    kind: dns
    source: oci://ghcr.io/drtui/cloudflare-provider
    version: 1.4.0
    digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
    requiredClis: [cf]
    config:
      accountId: "${{ inputs.cloudflare_account_id }}"
      zoneId: "${{ inputs.cloudflare_zone_id }}"
      apiToken: "${{ steps.fetch_secrets.outputs.cloudflare_api_token }}"

transactions:
  recovery:
    rollback: on-failure

policy:
  maxParallel: 1
  failFast: true
  requireSignatures: true
  allowUnpinned: false
  workDirectory: ephemeral

steps:
  - id: initialize_secrets
    name: Authenticate to Cloudflare Secrets Store
    uses: recovery_secrets/initialize
    timeout: 30s
    with:
      authConfig:
        method: cloudflare-api-token
        parameters:
          tokenEnv: CLOUDFLARE_API_TOKEN

  - id: fetch_secrets
    name: Lease recovery secrets
    uses: recovery_secrets/fetchPlanSecrets
    needs: [initialize_secrets]
    timeout: 30s
    with:
      planId: coolify-s3-cloudflare
    outputs:
      coolify_app_key:
        type: secret
        from: result.secrets.COOLIFY_APP_KEY
        sensitive: true
      cloudflare_api_token:
        type: secret
        from: result.secrets.CLOUDFLARE_API_TOKEN
        sensitive: true
      r2_access_key_id:
        type: secret
        from: result.secrets.R2_ACCESS_KEY_ID
        sensitive: true
      r2_secret_access_key:
        type: secret
        from: result.secrets.R2_SECRET_ACCESS_KEY
        sensitive: true

  - id: provision_target
    name: Provision the replacement host
    uses: hosting/provision
    needs: [fetch_secrets]
    transaction: recovery
    timeout: 20m
    with:
      request:
        targetName: compose-recovery
        spec:
          region: "${{ inputs.target_region }}"
          size: "${{ inputs.target_size }}"
          image: "${{ inputs.target_image }}"
    outputs:
      target:
        type: object
        from: result.target
      ssh:
        type: object
        from: result.ssh
    rollback:
      uses: hosting/destroy
      timeout: 20m
      with:
        target: "${{ steps.provision_target.outputs.target }}"

  - id: verify_target
    name: Verify the pinned SSH host before mutation
    uses: engine/probeSSH
    needs: [provision_target]
    transaction: recovery
    timeout: 5m
    with:
      connection: "${{ steps.provision_target.outputs.ssh }}"
      minimumDiskGiB: 200
      requiredTcpEgress: [443, 7844]

  - id: download_coolify_state
    name: Download and verify the Coolify state archive from R2
    uses: s3/downloadBlob
    needs: [verify_target]
    transaction: recovery
    timeout: 15m
    with:
      sourcePath: "${{ inputs.coolify_state_uri }}"
      expectedSha256: "${{ inputs.coolify_state_sha256 }}"
      localDestination: "${{ runtime.workDir.coolify-state }}"
    rollback:
      uses: engine/removePath
      timeout: 30s
      with:
        path: "${{ runtime.workDir.coolify-state }}"

  - id: load_recovery_manifest
    name: Verify the R2 inventory and explicit database backup formats
    uses: s3/readRecoveryManifest
    needs: [download_coolify_state]
    transaction: recovery
    timeout: 5m
    with:
      sourcePath: "${{ inputs.recovery_manifest_uri }}"
      expectedSha256: "${{ inputs.recovery_manifest_sha256 }}"
      schema: schemas/recovery-manifest.schema.json
    outputs:
      workloads:
        type: array
        from: result.workloads
      routes:
        type: array
        from: result.routes

  - id: fetch_compose
    name: Fetch GitHub Compose definitions at exact commits
    uses: github/fetchCompose
    needs: [load_recovery_manifest]
    transaction: recovery
    timeout: 10m
    with:
      workloads: "${{ steps.load_recovery_manifest.outputs.workloads }}"
      destination: "${{ runtime.workDir.compose }}"
      allowMutableRefs: false
    outputs:
      definitions:
        type: array
        from: result.definitions
    rollback:
      uses: engine/removePath
      timeout: 30s
      with:
        path: "${{ runtime.workDir.compose }}"

  - id: bootstrap_runtime
    name: Restore Coolify configuration without starting recovered workloads
    uses: coolify/bootstrapRuntime
    needs: [fetch_compose]
    transaction: recovery
    timeout: 20m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      stateArchive: "${{ runtime.workDir.coolify-state }}"
      appKey: "${{ steps.fetch_secrets.outputs.coolify_app_key }}"
      startWorkloads: false
      startTunnel: false
    rollback:
      uses: coolify/destroyRuntime
      timeout: 10m
      with:
        targetHost: "${{ steps.provision_target.outputs.ssh }}"

  - id: verify_runtime
    name: Verify remote Docker Compose and cloudflared prerequisites
    uses: compose/verifyRuntime
    needs: [bootstrap_runtime]
    transaction: recovery
    timeout: 2m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      requiredExecutables: [docker, cloudflared]
      requireComposeV2: true
      requireDockerDaemon: true

  - id: restore_databases
    name: Restore database backups into isolated Compose volumes
    uses: compose/restoreDatabases
    needs: [verify_runtime]
    transaction: recovery
    timeout: 60m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      definitions: "${{ steps.fetch_compose.outputs.definitions }}"
      workloads: "${{ steps.load_recovery_manifest.outputs.workloads }}"
      storageProvider: s3
      requireChecksums: true
      requireStoppedArchiveVolumes: true
      overwriteExistingVolumes: false
    rollback:
      uses: compose/removeRecoveredDatabases
      timeout: 10m
      with:
        targetHost: "${{ steps.provision_target.outputs.ssh }}"
        onlyRunOwnedResources: true

  - id: verify_databases
    name: Verify database health and declared read-only checks
    uses: compose/verifyDatabases
    needs: [restore_databases]
    transaction: recovery
    timeout: 5m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      workloads: "${{ steps.load_recovery_manifest.outputs.workloads }}"

  - id: deploy_services
    name: Deploy GitHub-managed applications after database verification
    uses: compose/deployApplications
    needs: [verify_databases]
    transaction: recovery
    timeout: 20m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      definitions: "${{ steps.fetch_compose.outputs.definitions }}"
    rollback:
      uses: compose/removeApplications
      timeout: 10m
      with:
        targetHost: "${{ steps.provision_target.outputs.ssh }}"
        onlyRunOwnedResources: true
        deleteVolumes: false

  - id: verify_applications
    name: Verify every recovered route locally before exposing a tunnel
    uses: compose/verifyRoutes
    needs: [deploy_services]
    transaction: recovery
    timeout: 5m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      routes: "${{ steps.load_recovery_manifest.outputs.routes }}"

  - id: create_tunnel
    name: Create a replacement tunnel without changing public routes
    uses: cloudflare/createTunnel
    needs: [verify_applications]
    transaction: recovery
    timeout: 2m
    outputs:
      tunnel_id:
        type: string
        from: result.tunnelId
      connector_token:
        type: secret
        from: result.connectorToken
        sensitive: true
    rollback:
      uses: cloudflare/deleteTunnel
      timeout: 2m
      with:
        tunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"
        onlyRunOwnedResources: true

  - id: configure_tunnel
    name: Configure replacement ingress with a terminal deny rule
    uses: cloudflare/configureTunnel
    needs: [create_tunnel]
    transaction: recovery
    timeout: 2m
    with:
      tunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"
      routes: "${{ steps.load_recovery_manifest.outputs.routes }}"
      catchAll: http_status:404

  - id: start_connector
    name: Start cloudflared on the recovered host using a leased token
    uses: compose/startConnector
    needs: [configure_tunnel]
    transaction: recovery
    timeout: 2m
    with:
      targetHost: "${{ steps.provision_target.outputs.ssh }}"
      tunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"
      token: "${{ steps.create_tunnel.outputs.connector_token }}"
      transport: http2
    rollback:
      uses: compose/stopConnector
      timeout: 2m
      with:
        targetHost: "${{ steps.provision_target.outputs.ssh }}"
        tunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"

  - id: verify_tunnel
    name: Verify replacement connector health before hostname cutover
    uses: cloudflare/verifyTunnel
    needs: [start_connector]
    transaction: recovery
    timeout: 5m
    with:
      tunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"

  - id: snapshot_routes
    name: Snapshot exact previous DNS records for compensation
    uses: cloudflare/snapshotRoutes
    needs: [verify_tunnel]
    transaction: recovery
    timeout: 2m
    with:
      routes: "${{ steps.load_recovery_manifest.outputs.routes }}"
    outputs:
      previous_records:
        type: array
        from: result.records

  - id: sync_dns
    name: Route hostnames to the replacement tunnel, never a public IP
    uses: cloudflare/syncTunnelRoutes
    needs: [snapshot_routes]
    transaction: recovery
    timeout: 5m
    with:
      routes: "${{ steps.load_recovery_manifest.outputs.routes }}"
      tunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"
      expectedPreviousRecords: "${{ steps.snapshot_routes.outputs.previous_records }}"
    rollback:
      uses: cloudflare/restoreRoutes
      timeout: 5m
      with:
        records: "${{ steps.snapshot_routes.outputs.previous_records }}"
        expectedTunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"

  - id: verify_dns
    name: Verify authoritative tunnel routes and public application health
    uses: cloudflare/verifyTunnelRoutes
    needs: [sync_dns]
    transaction: recovery
    timeout: 5m
    with:
      routes: "${{ steps.load_recovery_manifest.outputs.routes }}"
      expectedTunnelId: "${{ steps.create_tunnel.outputs.tunnel_id }}"
